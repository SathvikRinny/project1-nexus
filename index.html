<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your account.">
    <title>Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <main class="card">
        <img class="avatar" src="avatar.webp" alt="" width="84" height="84">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to continue</p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email"
                    required>
                <p class="error" id="email-error" aria-live="polite"></p>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input id="password" name="password" type="password" placeholder="Your password"
                        autocomplete="current-password" required>
                    <button type="button" class="toggle-password" data-target="password"
                        aria-label="Show password">Show</button>
                </div>
                <p class="error" id="password-error" aria-live="polite"></p>
            </div>

            <div class="row">
                <label class="checkbox"><input type="checkbox" id="remember"> Remember me</label>
                <a href="#" id="forgot">Forgot password?</a>
            </div>

            <button type="submit" class="btn">Log In</button>
            <p class="status" id="status" aria-live="polite"></p>
        </form>

        <p class="switch">New here? <a href="signup.html">Create an account</a></p>
    </main>

    <script src="script.js"></script>
</body>

</html>
