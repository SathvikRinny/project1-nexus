<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new account.">
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <main class="card">
        <img class="avatar" src="avatar.webp" alt="" width="84" height="84">
        <h1>Create account</h1>
        <p class="subtitle">It only takes a minute</p>

        <form id="signupForm" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="3–20 letters, numbers or _"
                    autocomplete="username" required>
                <p class="error" id="username-error" aria-live="polite"></p>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email"
                    required>
                <p class="error" id="email-error" aria-live="polite"></p>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input id="password" name="password" type="password" placeholder="At least 8 characters"
                        autocomplete="new-password" required>
                    <button type="button" class="toggle-password" data-target="password"
                        aria-label="Show password">Show</button>
                </div>
                <div class="strength" aria-hidden="true"><span id="strength-bar"></span></div>
                <p class="strength-label" id="strength-label"></p>
                <p class="error" id="password-error" aria-live="polite"></p>
            </div>

            <div class="field">
                <label for="confirm">Confirm password</label>
                <div class="input-wrap">
                    <input id="confirm" name="confirm" type="password" placeholder="Repeat your password"
                        autocomplete="new-password" required>
                    <button type="button" class="toggle-password" data-target="confirm"
                        aria-label="Show password">Show</button>
                </div>
                <p class="error" id="confirm-error" aria-live="polite"></p>
            </div>

            <button type="submit" class="btn">Sign Up</button>
            <p class="status" id="status" aria-live="polite"></p>
        </form>

        <p class="switch">Already have an account? <a href="index.html">Log in</a></p>
    </main>

    <script src="script.js"></script>
</body>

</html>
